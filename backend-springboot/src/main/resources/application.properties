# ===================================================================
# SmartSync: Spring Boot 3.x Configuration File
# Phase 2: MySQL Connection & Security Setup
# ===================================================================

server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smartsync_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=9a4f2c8d3b7a1e6f4c8d2e0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.smartsync=DEBUG
logging.level.org.springframework.security=INFO
